<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">La Misma Receta logo</title>
  <desc id="desc">Wordmark with artisan pastry emblem.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="120" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7EF"/>
      <stop offset="1" stop-color="#FDEBD9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B46A3C"/>
      <stop offset="1" stop-color="#8F4E2A"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B8754E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1160" height="360" rx="26" fill="url(#bg)"/>

  <g transform="translate(70,55)" filter="url(#soft)">
    <rect x="0" y="0" width="250" height="250" rx="125" fill="#FFFDF9" stroke="#D7A786" stroke-width="5"/>

    <path d="M125 42C161 42 194 62 208 93C220 120 216 151 198 174C180 197 152 210 125 210C98 210 70 197 52 174C34 151 30 120 42 93C56 62 89 42 125 42Z" fill="#FFF3E6"/>

    <path d="M65 128C86 106 106 96 125 96C144 96 164 106 185 128" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>
    <path d="M77 155C95 138 111 130 125 130C139 130 155 138 173 155" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

    <circle cx="82" cy="96" r="5" fill="#C88256"/>
    <circle cx="168" cy="96" r="5" fill="#C88256"/>
    <circle cx="125" cy="77" r="5" fill="#C88256"/>

    <path d="M125 26V58" stroke="#B46A3C" stroke-width="6" stroke-linecap="round"/>
    <path d="M109 43L125 26L141 43" stroke="#B46A3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(370,95)">
    <text x="0" y="86" fill="#6C3922" font-size="74" font-weight="600" font-family="Cormorant Garamond, Didot, Georgia, serif" letter-spacing="1.1">
      La Misma
    </text>
    <text x="0" y="168" fill="#A35E39" font-size="92" font-weight="700" font-family="Cormorant Garamond, Didot, Georgia, serif" letter-spacing="1.5">
